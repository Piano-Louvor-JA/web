name: Coverage Gate

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage (src/shared)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Coverage gate (50% staging PR; 100% main/publication)
        run: npm run test:coverage:gate
