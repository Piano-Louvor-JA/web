# CI — LouvorJA Web
# PR/push: lint, type-check, test, build, regression gate, quality gate
# Deploy fica a cargo da hospedagem (branches staging/main)
# Manual: Actions → CI → Run workflow
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  regression-gate:
    name: Regression Gate (anti-regressão)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline (staging)
        run: |
          # O script ainda não existe na staging. Guarda a cópia da PR
          # e mede o código da staging com ele.
          cp scripts/test-regression.mjs /tmp/test-regression.mjs
          echo "PR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout origin/staging
          node /tmp/test-regression.mjs --baseline
      - name: Compare (PR branch)
        run: |
          git checkout "$PR_SHA"
          node /tmp/test-regression.mjs --compare

  mutation-score:
    name: Mutation Score (diff do PR)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    continue-on-error: true # fase 1: warning apenas — virar bloqueante quando o baseline estiver maduro
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Valida o seletor e a métrica de mutação
        run: node --test scripts/__tests__/mutation-diff.test.mjs
      - name: Stryker incremental só nos arquivos do diff
        run: node scripts/mutation-diff.mjs --base origin/${{ github.base_ref }}
      - name: Salva relatório como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-diff-report
          path: reports/mutation/mutation-diff.json
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, regression-gate]
    if: always()
    steps:
      - name: Verifica se todos os gates passaram
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "regression-gate: ${{ needs.regression-gate.result }}"
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.typecheck.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Quality Gate FALHOU — corrija os erros antes do merge"
            exit 1
          fi
          # regression-gate roda só em PR; em push ignora skipped
          if [[ "${{ needs.regression-gate.result }}" == "failure" ]]; then
            echo "::error::Regression Gate FALHOU — detectada regressão vs staging"
            exit 1
          fi
          echo "Quality Gate PASSOU"
